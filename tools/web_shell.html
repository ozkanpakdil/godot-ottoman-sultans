<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		html,
		body,
		#canvas {
			margin: 0;
			padding: 0;
			border: 0;
		}

		body {
			color: white;
			background-color: #0d0d12;
			overflow: hidden;
			touch-action: none;
		}

		#canvas {
			display: block;
		}

		#canvas:focus {
			outline: none;
		}

		#status,
		#status-splash,
		#status-progress {
			position: absolute;
			left: 0;
			right: 0;
		}

		#status,
		#status-splash {
			top: 0;
			bottom: 0;
		}

		#status {
			background-color: $GODOT_SPLASH_COLOR;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			visibility: hidden;
		}

		#status-content {
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			gap: 1.5rem;
			width: 100%;
			box-sizing: border-box;
		}

		#status-logo {
			max-height: 35vh;
			max-width: 70vw;
			width: auto;
			height: auto;
		}

		#status-logo.show-image--false {
			display: none;
		}

		#status-logo.fullsize--true {
			/* The engine marks the splash as full-size, but we want it centered
	   and reasonably sized above the progress bar. */
			height: auto;
			width: auto;
			max-height: 35vh;
			max-width: 70vw;
			object-fit: contain;
		}

		#status-logo.use-filter--false {
			image-rendering: pixelated;
		}

		#status-title {
			/* The splash image already contains the game title. */
			display: none;
		}

		#status-progress,
		#status-notice {
			display: none;
		}

		#status-progress {
			width: min(80%, 420px);
			min-width: 240px;
			height: 0.5rem;
			margin: 1.25rem auto 0;
			border-radius: 0.25rem;
			background-color: rgba(255, 255, 255, 0.15);
			border: none;
			display: block;
		}

		#status-progress::-webkit-progress-bar {
			background-color: rgba(255, 255, 255, 0.15);
			border-radius: 0.25rem;
		}

		#status-progress::-webkit-progress-value {
			background-color: #d9b96b;
			border-radius: 0.25rem;
		}

		#status-progress::-moz-progress-bar {
			background-color: #d9b96b;
			border-radius: 0.25rem;
		}

		#status-notice {
			background-color: #5b3943;
			border-radius: 0.5rem;
			border: 1px solid #9b3943;
			color: #e0e0e0;
			font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
			line-height: 1.3;
			margin: 0 2rem;
			overflow: hidden;
			padding: 1rem;
			text-align: center;
			z-index: 1;
		}
	</style>
	$GODOT_HEAD_INCLUDE
</head>

<body>
	<canvas id="canvas">
		Your browser does not support the canvas tag.
	</canvas>

	<noscript>
		Your browser does not support JavaScript.
	</noscript>

	<div id="status">
		<div id="status-content">
			<img id="status-logo" class="$GODOT_SPLASH_CLASSES" src="$GODOT_SPLASH" alt="$GODOT_PROJECT_NAME">
			<div id="status-title">$GODOT_PROJECT_NAME</div>
			<hr />
		</div>
		<div id="status-message">Loading...</div>
		<progress id="status-progress"></progress>
		<div id="status-notice"></div>
	</div>

	<script src="$GODOT_URL"></script>
	<script>
		const GODOT_CONFIG = $GODOT_CONFIG;
		const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
		const engine = new Engine(GODOT_CONFIG);

		(function () {
			const statusOverlay = document.getElementById('status');
			const statusProgress = document.getElementById('status-progress');
			const statusNotice = document.getElementById('status-notice');

			let initializing = true;
			let statusMode = '';

			function setStatusMode(mode) {
				if (statusMode === mode || !initializing) {
					return;
				}
				if (mode === 'hidden') {
					statusOverlay.remove();
					initializing = false;
					return;
				}
				statusOverlay.style.visibility = 'visible';
				statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
				statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
				statusMode = mode;
			}

			function setStatusNotice(text) {
				while (statusNotice.lastChild) {
					statusNotice.removeChild(statusNotice.lastChild);
				}
				const lines = text.split('\n');
				lines.forEach((line) => {
					statusNotice.appendChild(document.createTextNode(line));
					statusNotice.appendChild(document.createElement('br'));
				});
			}

			function displayFailureNotice(err) {
				console.error(err);
				if (err instanceof Error) {
					setStatusNotice(err.message);
				} else if (typeof err === 'string') {
					setStatusNotice(err);
				} else {
					setStatusNotice('An unknown error occurred.');
				}
				setStatusMode('notice');
				initializing = false;
			}

			const missing = Engine.getMissingFeatures({
				threads: GODOT_THREADS_ENABLED,
			});

			if (missing.length !== 0) {
				if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
					let serviceWorkerRegistrationPromise;
					try {
						serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
					} catch (err) {
						serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
					}
					Promise.race([
						serviceWorkerRegistrationPromise.then((registration) => {
							if (registration != null) {
								return Promise.reject(new Error('Service worker already exists.'));
							}
							return registration;
						}).then(() => engine.installServiceWorker()),
						new Promise((resolve) => {
							setTimeout(() => resolve(), 2000);
						}),
					]).then(() => {
						window.location.reload();
					}).catch((err) => {
						console.error('Error while registering service worker:', err);
					});
				} else {
					const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
					displayFailureNotice(missingMsg + missing.join('\n'));
				}
			} else {
				setStatusMode('progress');
				engine.startGame({
					'onProgress': function (current, total) {
						if (current > 0 && total > 0) {
							statusProgress.value = current;
							statusProgress.max = total;
						} else {
							statusProgress.removeAttribute('value');
							statusProgress.removeAttribute('max');
						}
					},
				}).then(() => {
					setStatusMode('hidden');
				}, displayFailureNotice);
			}
		}());
	</script>
	<script>
		// Mobile touch handling for the web build.
		// Godot's HTML5 export sometimes delivers touch as mouse motion, so we
		// track touches directly and forward pan / pinch / tap events to the
		// game through JavaScriptBridge callbacks registered by Map.gd.
		(function () {
			const canvas = document.getElementById('canvas');
			if (!canvas) {
				return;
			}

			const touchState = new Map();
			let prevTouches = [];

			function touchArrayFromList(list) {
				const arr = [];
				for (let i = 0; i < list.length; i++) {
					const t = list[i];
					const s = touchState.get(t.identifier) || {
						moved: false,
						startX: t.clientX,
						startY: t.clientY,
						startTime: Date.now(),
					};
					arr.push({
						id: t.identifier,
						x: t.clientX,
						y: t.clientY,
						moved: s.moved,
						startX: s.startX,
						startY: s.startY,
						startTime: s.startTime,
					});
				}
				return arr;
			}

			function updateTouchState(curr) {
				for (const t of curr) {
					const s = touchState.get(t.id) || {
						moved: false,
						startX: t.x,
						startY: t.y,
						startTime: Date.now(),
					};
					if (Math.hypot(t.x - s.startX, t.y - s.startY) > 10) {
						s.moved = true;
					}
					s.x = t.x;
					s.y = t.y;
					touchState.set(t.id, s);
				}
			}

			canvas.addEventListener('touchstart', (e) => {
				e.preventDefault();
				for (const t of e.changedTouches) {
					touchState.set(t.identifier, {
						x: t.clientX,
						y: t.clientY,
						startX: t.clientX,
						startY: t.clientY,
						startTime: Date.now(),
						moved: false,
					});
				}
				prevTouches = touchArrayFromList(e.touches);
			}, { passive: false });

			canvas.addEventListener('touchmove', (e) => {
				e.preventDefault();
				const curr = touchArrayFromList(e.touches);
				if (window.godotMapTouch && prevTouches.length > 0) {
					if (curr.length === 1 && prevTouches.length === 1) {
						const dx = curr[0].x - prevTouches[0].x;
						const dy = curr[0].y - prevTouches[0].y;
						window.godotMapTouch(['pan', dx, dy]);
					} else if (curr.length === 2 && prevTouches.length === 2) {
						const prevCx = (prevTouches[0].x + prevTouches[1].x) / 2;
						const prevCy = (prevTouches[0].y + prevTouches[1].y) / 2;
						const currCx = (curr[0].x + curr[1].x) / 2;
						const currCy = (curr[0].y + curr[1].y) / 2;
						const prevDist = Math.hypot(prevTouches[0].x - prevTouches[1].x, prevTouches[0].y - prevTouches[1].y);
						const currDist = Math.hypot(curr[0].x - curr[1].x, curr[0].y - curr[1].y);
						const ratio = (prevDist > 0 && currDist > 0) ? prevDist / currDist : 1.0;
						window.godotMapTouch(['pinch', currCx - prevCx, currCy - prevCy, ratio]);
					}
				}
				updateTouchState(curr);
				prevTouches = curr;
			}, { passive: false });

			canvas.addEventListener('touchend', (e) => {
				e.preventDefault();
				for (const t of e.changedTouches) {
					const s = touchState.get(t.identifier);
					if (s && !s.moved && Date.now() - s.startTime < 600 && touchState.size === 1) {
						if (window.godotMapClick) {
							window.godotMapClick([t.clientX, t.clientY]);
						}
					}
					touchState.delete(t.identifier);
				}
				prevTouches = touchArrayFromList(e.touches);
			}, { passive: false });

			canvas.addEventListener('touchcancel', (e) => {
				e.preventDefault();
				for (const t of e.changedTouches) {
					touchState.delete(t.identifier);
				}
				prevTouches = touchArrayFromList(e.touches);
			}, { passive: false });
		}());
	</script>
</body>

</html>
